<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden">
    <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      <a-assets>
        <a-asset-item id="wargreymon-digimon-model" src="/assets/wargreymon_digimon/scene.gltf"></a-asset-item>
        <a-asset-item id="digimon-loogamon-model" src="/assets/digimon_loogamon/scene.gltf"></a-asset-item>
        <a-asset-item id="digimon-gogmamon-model" src="/assets/digimon_gogmamon/scene.gltf"></a-asset-item>
        <a-asset-item id="digimon-garurumon-model" src="/assets/digimon_garurumon/scene.gltf"></a-asset-item>
        <a-asset-item id="digimon-guilmon-model" src="/assets/digimon_guilmon/scene.gltf"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity gltf-model="#wargreymon-digimon-model" scale="0.3 0.3 0.3"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; startEvents:mouseenter"></a-entity>
      </a-marker>

      <a-marker preset="kanji">
        <a-entity gltf-model="#digimon-loogamon-model" scale="0.4 0.4 0.4"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000;"></a-entity>
      </a-marker>

      <a-marker type="barcode" value="10">
        <a-entity gltf-model="#digimon-gogmamon-model" scale="0.3 0.3 0.3"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000;"></a-entity>
      </a-marker>

      <a-marker type="barcode" value="11">
        <a-entity gltf-model="#digimon-garurumon-model" scale="0.4 0.4 0.4"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000;"></a-entity>
      </a-marker>

      <a-marker type="barcode" value="12">
        <a-entity gltf-model="#digimon-guilmon-model" scale="0.4 0.4 0.4"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000;"></a-entity>
      </a-marker>

      <a-entity camera>
        <a-cursor></a-cursor>
      </a-entity>
    </a-scene>
  </body>
</html>
