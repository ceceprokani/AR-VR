<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Walking in Outer Space - By Cecep Rokani</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    
    <!-- A-Frame -->
    <script src="dist/aframe-master.js"></script>
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.4/dist/aframe-environment-component.min.js"></script>
    <script src="js/info-message.js"></script>
</head>

<body>
    <a-scene fog="color: #241417; near: 0; far: 30;" raycaster="far: 100; objects: [link];" cursor="rayOrigin: mouse"
        camera-position environment="preset: yavapai" info-message="htmlSrc: #messageText">
        
        <a-assets>
            <img id="thumbJupiter" crossOrigin="anonymous" src="assets/images/jupiter.png">
            <img id="thumbMoon" crossOrigin="anonymous" src="assets/images/moon.png">
            <img id="thumbSun" crossOrigin="anonymous" src="assets/images/sun.png">
            <img id="thumb3Dplanets" crossOrigin="anonymous" src="assets/images/3d-planets.jpg">
            <img id="thumbEarth" crossOrigin="anonymous" src="assets/images/earth.png">
            <audio id="space_audio" src="assets/space-audio.mp3"></audio>
            <a-asset-item id="messageText" src="message.html"></a-asset-item>
        </a-assets>

        <a-sound src="#space_audio" autoplay="true"></a-sound>

        <!-- Planet Links -->
        <a-link href="jupiter.html" title="Jupiter" position="-7 1.5 -3.0" image="#thumbJupiter"></a-link>
        <a-link href="index.html" title="Bulan" position="-3.5 1.5 -3.0" image="#thumbMoon"></a-link>
        <a-link href="sun.html" title="Matahari" position="0 1.5 -3.0" image="#thumbSun"></a-link>
        <a-link href="earth.html" title="Bumi" position="3.5 1.5 -3.0" image="#thumbEarth"></a-link>
        <a-link href="3d-planets.html" title="AR 3D Planets" position="7 1.5 -3.0" image="#thumb3Dplanets"></a-link>

        <!-- Lighting -->
        <a-entity light="type: point; color: #f4f4f4; intensity: 0.4; distance: 0" position="0 2 0"></a-entity>

        <a-entity id="leftHand" link-controls="hand: left"></a-entity>
        <a-entity id="rightHand" link-controls="hand: right"></a-entity>
        
        <!-- Camera -->
        <a-entity id="cameraRig">
            <a-entity id="camera" camera position="0 1.6 3" look-controls camera-position></a-entity>
        </a-entity>
    </a-scene>

    <!-- Joystick untuk Mobile -->
    <div id="joystick-container">
        <button class="joystick" id="left-btn"><i class="fas fa-arrow-left"></i></button>
        <button class="joystick" id="up-btn"><i class="fas fa-arrow-up"></i></button>
        <button class="joystick" id="down-btn"><i class="fas fa-arrow-down"></i></button>
        <button class="joystick" id="right-btn"><i class="fas fa-arrow-right"></i></button>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
